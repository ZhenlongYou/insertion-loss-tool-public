[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insertion-loss-tool"
version = "0.6.0"
description = "Generate, validate, modify, and plot Touchstone insertion-loss files."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "matplotlib>=3.7",
  "Pillow>=10.0",
  "pywebview==6.2.1",
]

[project.optional-dependencies]
validation = [
  "scikit-rf==1.7.0; python_version >= '3.10'",
]

[project.scripts]
insertion-loss-tool = "insertion_loss_tool.webview_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insertion_loss_tool = ["webui/*.html"]
